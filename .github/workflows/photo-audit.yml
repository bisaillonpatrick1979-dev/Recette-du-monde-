# Robot d'audit photo : télécharge la miniature de la photo de chaque recette publiée et la publie
# sur une branche « photo-audit/run-<n> » pour un contrôle visuel. Ne modifie rien dans l'application.
#
# Déclenchement : pousser sur une branche « robot-audit/** », ou lancer à la main (Actions › Run workflow).
name: Audit photos

on:
  push:
    branches:
      - "robot-audit/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photo-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      # Clé publique (déjà embarquée dans le site) : lecture des recettes publiées uniquement.
      SUPABASE_URL: https://lnrmcubcxtnzqynfzghv.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_AUpLIpSZrNnAILatCvPv2w_7UGLZa66
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger les miniatures
        run: |
          mkdir -p "$RUNNER_TEMP/photo-audit"
          set -o pipefail
          node scripts/recipe-batches/audit-photos.mjs "$RUNNER_TEMP/photo-audit" 2>&1 | tee "$RUNNER_TEMP/photo-audit/journal.txt"
      - name: Publier sur une branche photo-audit/run-<n>
        if: always()
        run: |
          cd "$RUNNER_TEMP/photo-audit"
          echo "Source : ${GITHUB_REF_NAME} @ ${GITHUB_SHA}" > SOURCE.txt
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          BR="photo-audit/run-${GITHUB_RUN_NUMBER}"
          git init -q -b "$BR"
          git config user.name "spoontrotter-photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Audit photo (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
